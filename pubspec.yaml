name: offline_cbt
description: Offline CBT for csskabba-portal — run CBT exams on the school Wi-Fi without internet and upload the results to the portal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cbt_core:
    path: packages/cbt_core
  crypto: ^3.0.3
  path: ^1.9.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
