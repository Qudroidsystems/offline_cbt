# Builds the Windows installer on GitHub's own Windows machines — no local Windows/Flutter setup needed.
# Run it from the "Actions" tab (Run workflow), or push a tag like v1.0.1 to also publish a release.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./installer/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineCBT-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
